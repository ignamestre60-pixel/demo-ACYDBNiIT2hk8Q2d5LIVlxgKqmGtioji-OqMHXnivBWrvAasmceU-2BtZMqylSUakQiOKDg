        }

        header {

            z-index: 1000;

            justify-content: space-between;
            padding: 0 40px;
        }

            letter-spacing: 2px;

            background-clip: text;

            display: flex;

        .header-nav a:hover {

            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-header:hover {
            background-color: var(--color-accent);
            transform: translateY(-2px);
        }
